#
# Trime 默认主题（V2 格式，对齐「元书/Hamster」皮肤标准）。
# - 语义化 camelCase 键名，按 keyboard / candidateBar / colorSchemas 等分层；
# - 与 librime 部署通道完全解耦，由 Trime 独立解析；
# - 配色严格只有日间 light 与夜间 dark 两个。
#
version: '1.0'
name: 預設
author: osfans
keyboard:
  autoCaps: false
  horizontalGap: 1
  padding: 0
  paddingLeft: 0
  paddingRight: 40
  paddingBottom: 0
  paddingLandscape: 40
  paddingLandscapeBottom: 0
  keyHeight: 44
  longTextSize: 14
  textSize: 22
  keyWidth: 10.0
  labelTextSize: 22
  height: 250
  heightLandscape: 200
  # 键盘高度占屏幕宽度百分比（> 0 时优先于上面的 height），
  # 让键的宽高比在不同尺寸屏幕上保持一致，消除固定 dp 高度带来的变形拉伸。
  keyboardHeightRatio: 65
  resetAsciiModeOnFocusChange: false
  roundCorner: 8
  shadowRadius: 0.0
  symbolTextSize: 10
  verticalGap: 1
candidateBar:
  padding: 5
  spacing: 0.0
  textSize: 22
  textVerticalBias: 1.0
  viewHeight: 28
  commentHeight: 12
  commentPosition: right
  commentVerticalBias: 0.0
  commentTextSize: 10
fonts:
  candidate: han.ttf
  comment: comment.ttf
  hanb: hanb.ttf
  key: symbol.ttf
  label: label.ttf
  latin: latin.ttf
  symbol: symbol.ttf
  text: latin.ttf
enterKey:
  mode: 0
  labels:
    go: 前往
    done: 完成
    next: 下个
    pre: 上个
    search: 搜索
    send: 发送
    default: Enter
preedit:
  horizontalPadding: 8
  topStartRadius: 4
  topEndRadius: 4
  foreground:
    fontSize: 16
window:
  insets:
    vertical: 4
    horizontal: 4
  itemPadding:
    horizontal: 4
  foreground:
    labelFontSize: 20
    textFontSize: 20
    commentFontSize: 16
fallbackColors:
  candidateTextColor: textColor
colorSchemas:
  light:
    backColor: 0xe4e7e9
    borderColor: 0xc1c7ca
    candidateSeparatorColor: 0xc1c7ca
    candidateTextColor: 0x5a676e
    commentTextColor: 0x7b868c
    hilitedBackColor: 0xccd3d7da
    hilitedCandidateBackColor: 0xd3d7da
    hilitedCandidateTextColor: 0x000000
    hilitedCommentTextColor: 0x000000
    hilitedKeyBackColor: 0xd3d7da
    hilitedKeySymbolColor: 0x000000
    hilitedKeyTextColor: 0x000000
    hilitedOffKeyBackColor: 0xd3d7da
    hilitedOffKeyTextColor: 0x000000
    hilitedOnKeyBackColor: 0xd3d7da
    hilitedOnKeyTextColor: 0x000000
    hilitedTextColor: 0x23948e
    keyBackColor: 0xeceff1
    keySymbolColor: 0x5f6b73
    keyTextColor: 0x37474f
    keyboardBackColor: 0xffffff
    labelColor: 0x000000
    offKeyBackColor: 0xd3d7da
    offKeyTextColor: 0x000000
    onKeyBackColor: 0x23948e
    onKeyTextColor: 0x37474f
    popupBackColor: 0x55bfbfbf
    popupTextColor: 0x23948e
    shadowColor: 0x000000
    textColor: 0x5a676e
    textBackColor: 0xcce4e7e9
  dark:
    backColor: 0x222222
    borderColor: 0x333333
    candidateSeparatorColor: 0x333333
    candidateTextColor: 0xcccccc
    commentTextColor: 0x888888
    hilitedBackColor: 0x333333
    hilitedCandidateBackColor: 0x333333
    hilitedCandidateTextColor: 0xffffff
    hilitedCommentTextColor: 0xffffff
    hilitedKeyBackColor: 0x333333
    hilitedKeySymbolColor: 0xffffff
    hilitedKeyTextColor: 0xffffff
    hilitedOffKeyBackColor: 0x333333
    hilitedOffKeyTextColor: 0xffffff
    hilitedOnKeyBackColor: 0x333333
    hilitedOnKeyTextColor: 0xffffff
    hilitedTextColor: 0x23948e
    keyBackColor: 0x2b2b2b
    keySymbolColor: 0x999999
    keyTextColor: 0xcccccc
    keyboardBackColor: 0x111111
    labelColor: 0xcccccc
    offKeyBackColor: 0x2b2b2b
    offKeyTextColor: 0xcccccc
    onKeyBackColor: 0x23948e
    onKeyTextColor: 0xcccccc
    shadowColor: 0x000000
    textColor: 0xcccccc
    textBackColor: 0x33222222
keys:
  BRIGHTNESS_DOWN:
    label: 亮度-
    send: BRIGHTNESS_DOWN
  BRIGHTNESS_UP:
    label: 亮度+
    send: BRIGHTNESS_UP
  CALCULATOR:
    label: 計算機
    send: CALCULATOR
  CALENDAR:
    label: 日曆
    send: CALENDAR
  CONTACTS:
    label: 電話簿
    send: CONTACTS
  ENVELOPE:
    label: 信箱
    send: ENVELOPE
  EXPLORER:
    label: 瀏覽器
    send: EXPLORER
  MUSIC:
    label: 音樂
    send: MUSIC
  POWER:
    label: 電源
    send: POWER
  SEARCH:
    label: 搜尋
    send: SEARCH
  SLEEP:
    label: 休眠
    send: SLEEP
  VOICE_ASSIST:
    label: 語音
    send: VOICE_ASSIST
  VOLUME_DOWN:
    label: 音量-
    send: VOLUME_DOWN
  VOLUME_UP:
    label: 音量+
    send: VOLUME_UP
  VOLUME_MUTE:
    label: 靜音
    send: VOLUME_MUTE
  Shift_L:
    label: Shift
    send: Shift_L
    shiftLock: ascii_long
  Return:
    label: enter_labels
    send: Return
  Return1:
    label: Enter
    send: Return
  Return2:
    label: 回车
    send: Return
  Hide:
    label: 隱藏
    send: BACK
  BackSpace:
    label: 退格
    repeatable: true
    send: BackSpace
  space:
    repeatable: false
    functional: false
    send: space
  space1:
    label: 空格
    repeatable: false
    functional: false
    send: space
  Escape:
    label: Esc
    send: Escape
  Home:
    label: 行首
    send: Home
  Insert:
    label: 插入
    send: Insert
  Delete:
    label: 刪除
    send: Delete
  End:
    label: 行尾
    send: End
  Page_Up:
    label: 上頁
    send: Page_Up
  Page_Down:
    label: 下頁
    send: Page_Down
  Left:
    label: ←
    send: Left
  Down:
    label: ↓
    send: Down
  Up:
    label: ↑
    send: Up
  Right:
    label: →
    send: Right
  select_all:
    label: 全選
    send: Control+a
  Clear:
    label: 清除
    text: '{Control+a}{BackSpace}'
  cut:
    label: 剪下
    send: Control+x
  cut_all:
    label: 全挪
    text: '{Control+a}{Control+x}'
  copy:
    label: 複製
    send: Control+c
  copy_all:
    label: 全謄
    text: '{Control+a}{Control+c}'
  paste:
    label: 貼上
    send: Control+v
  paste_text:
    label: 貼上文本
    send: Control+Shift+Alt+v
  share_text:
    label: 分享文本
    send: Control+Alt+s
  redo:
    label: 重做
    send: Control+Shift+z
  undo:
    label: 撤銷
    send: Control+z
  F4:
    label: 方案選單
    send: F4
  BackToPreviousSyllable:
    label: 刪音節
    send: Control+BackSpace
  CommitRawInput:
    label: 編碼
    send: Control+Return
  CommitScriptText:
    label: 編碼
    send: Shift+Return
  CommitComment:
    label: 編碼
    send: Control+Shift+Return
  DeleteCandidate:
    label: 刪詞
    send: Control+Delete
  Mode_switch:
    toggle: ascii_mode
    send: SWITCH_CHARSET
    states:
    - 中文
    - 西文
  Zenkaku_Hankaku:
    toggle: full_shape
    send: SWITCH_CHARSET
    states:
    - 半角
    - 全角
  Henkan:
    toggle: simplification
    send: SWITCH_CHARSET
    states:
    - 漢字
    - 汉字
  Charset_switch:
    toggle: extended_charset
    send: SWITCH_CHARSET
    states:
    - 常用
    - 增廣
  Punct_switch:
    toggle: ascii_punct
    send: SWITCH_CHARSET
    states:
    - 。，
    - ．，
  Keyboard_symbols:
    label: 符號
    send: Eisu_toggle
    select: symbols
  Keyboard_number:
    label: 數字
    send: Eisu_toggle
    select: number
  Keyboard_mini:
    label: 迷你
    send: Eisu_toggle
    select: mini
  Keyboard_letter:
    label: 字母
    send: Eisu_toggle
    select: default
  Keyboard_default:
    label: 返回
    send: Eisu_toggle
    select: .default
  Keyboard_switch:
    label: 鍵盤
    send: Eisu_toggle
    select: .next
  liquid_keyboard_switch:
    label: 更多
    send: FUNCTION
    command: liquid_keyboard
    option: 更多
  liquid_keyboard_exit:
    label: 返回
    send: FUNCTION
    command: liquid_keyboard
    option: '-1'
  liquid_keyboard_emoji:
    label: 🙂
    send: FUNCTION
    command: liquid_keyboard
    option: emoji
  clipboard_window:
    label: 剪贴
    send: FUNCTION
    command: clipboard_window
    option: '0'
  set_color_ink:
    label: 切换到ink配色
    send: FUNCTION
    command: set_color_scheme
    option: ink
  set_theme_ink:
    label: 切换到ink主题
    send: FUNCTION
    command: set_theme
    option: ink
  IME_switch:
    label: 🌐
    send: LANGUAGE_SWITCH
  IME_last:
    label: 上一輸入法
    send: LANGUAGE_SWITCH
    select: .last
  IME_next:
    label: 下一輸入法
    send: LANGUAGE_SWITCH
    select: .next
  Schema_switch:
    label: 下一方案
    send: Control+Shift+1
  one_hand_switch_1:
    toggle: _one_hand_mode_1
    send: SWITCH_CHARSET
    states:
    - 左手
    - 普通
  one_hand_switch_2:
    toggle: _one_hand_mode_2
    send: SWITCH_CHARSET
    states:
    - 右手
    - 普通
  one_hand_switch_3:
    toggle: _one_hand_mode_3
    send: SWITCH_CHARSET
    states:
    - 左手
    - 右手
  Color_switch:
    label: 配色
    send: PROG_RED
  Help:
    label: 說明
    send: HELP
  Info:
    label: 關於
    send: INFO
  Menu:
    label: 方案
    send: MENU
  Settings:
    label: 設定
    send: SETTINGS
  Color_settings:
    label: 配色
    send: SETTINGS
    option: color
  Theme_settings:
    label: 主題
    send: SETTINGS
    option: theme
  Schema_settings:
    label: 方案
    send: SETTINGS
    option: schema
  Candidate_switch:
    toggle: _hide_candidate
    send: SWITCH_CHARSET
    states:
    - 有候選
    - 無候選
  Comment_switch:
    toggle: _hide_comment
    send: SWITCH_CHARSET
    states:
    - 有註釋
    - 無註釋
  Hint_switch:
    toggle: _hide_key_hint
    send: SWITCH_CHARSET
    states:
    - 有助記
    - 無助記
  Date:
    label: 日期
    command: date
    option: yyyy-MM-dd
  ChineseDate:
    label: 農曆
    command: date
    option: zh_CN@calendar=chinese
  Time:
    label: 時間
    command: date
    option: HH:mm:ss
  TrimeApp:
    label: 同文
    command: run
    option: com.osfans.trime
  TrimeCmp:
    label: 同文組件
    command: run
    option: com.osfans.trime/.ui.main.MainActivity
  Homepage:
    label: 同文主頁
    command: run
    option: https://github.com/osfans/trime
  CommitHomepage:
    label: 同文網址
    commit: https://github.com/osfans/trime
  Wiki:
    label: 維基
    command: run
    option: https://zh.wikipedia.org/wiki/%s
  Google:
    label: 谷歌
    command: run
    option: https://www.google.com/search?q=%s
  MoeDict:
    label: 萌典
    command: run
    option: https://www.moedict.tw/%3$s
  Baidu:
    label: 百度搜索
    command: run
    option: https://www.baidu.com/s?wd=%4$s
  Zdic:
    label: 漢典
    command: run
    option: http://www.zdic.net/sousuo/?q=%1$s
  Zdic2:
    label: 漢典
    command: run
    option: http://www.zdic.net/sousuo/?q=%2$s
  WebSearch:
    label: 搜索網頁
    command: web_search
    option: '%4$s'
  Search:
    label: 搜索
    command: search
    option: '%1$s'
  Share:
    label: 分享
    command: send
    option: '%s'
  Deploy:
    label: 部署
    send: FUNCTION
    command: apply
    option: DEPLOY
  Sync:
    label: 同步
    send: FUNCTION
    command: apply
    option: SYNC_USER_DATA
  updateConfig:
    label: 更新配置
    send: FUNCTION
    command: apply
    option: UPDATE_CONFIG
  RepeatCommit:
    label: 重复
    command: commit
    option: '%1$s'
