    comment_normal_text_color: *color3 #提示
    preedit_selected_back_color: *color2 #高亮编码背景
    candidate_selected_back_color: *color6 #高亮候选背景
    candidate_selected_text_color: *color2 #高亮候选文本
    comment_selected_text_color: *color1 #高亮提示
    key_pressed_back_color: *color6 #高亮按键背景
    key_pressed_symbol_color: *color2 #高亮按键符号
    key_pressed_text_color: *color1 #高亮按键文本
