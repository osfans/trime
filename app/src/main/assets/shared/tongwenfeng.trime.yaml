    preedit_normal_text_color: *color6 #编码
    preedit_normal_back_color: *color2 #编码区背景
    space_back_color: *color2 #空格键背景色
    space_text_color: *color1 #空格键文字颜色
    enter_back_color: *color6 #回车键背景色
    enter_text_color: *color2 #回车键文字颜色
    function_back_color: *color4 #功能键背景色
