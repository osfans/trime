#颜色
colors:
  1: &color1 0xff000000 
  2: &color2 0xffffffff 
  3: &color3 0xffe1e3e7 
  4: &color4 0xffacb2c2 
  5: &color5 0xff131313 
  6: &color6 0xff3266a0 
  7: &color7 0x00 
  8: &color8 0xff838383 
  
